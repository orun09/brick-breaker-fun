<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker Fun</title>
    
    <script src="https://orangejam.app/assets/js/orange-jam-sdk.js"></script>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle at center, #1a0b2e 0%, #050510 100%);
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 204, 0.2), inset 0 0 30px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-radius: 24px;
            overflow: hidden;
            width: 400px;
            height: 600px;
            background: #090a15;
        }
        canvas {
            display: block;
            background: transparent;
        }
        
        .score-board {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-sizing: border-box;
            z-index: 5;
            background: linear-gradient(90deg, rgba(255,0,85,0.1) 0%, rgba(0,255,204,0.1) 100%);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .neon-text {
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.8);
        }
        .pink-text {
            color: #ff0055;
            text-shadow: 0 0 10px rgba(255, 0, 85, 0.8);
        }
        
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.85);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 30px;
            z-index: 10;
        }

        .game-title {
            background: linear-gradient(to right, #ff0055, #cc00ff, #00ffcc);
            -webkit-background-clip: text;
            color: transparent;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 5px;
            text-align: center;
            font-weight: 900;
            filter: drop-shadow(0 0 15px rgba(204, 0, 255, 0.5));
        }
        .sub-title {
            color: #00ffcc;
            font-size: 22px;
            letter-spacing: 10px;
            text-transform: uppercase;
            margin-bottom: 50px;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(0, 255, 204, 0.6);
        }

        .game-over-title {
            color: #ff0055;
            font-size: 45px;
            text-transform: uppercase;
            text-shadow: 0 0 25px rgba(255, 0, 85, 0.7);
            margin-bottom: 15px;
            font-weight: 900;
        }

        .game-btn {
            background: linear-gradient(135deg, #cc00ff, #ff0055);
            color: white;
            border: none;
            padding: 16px 60px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(204, 0, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 2px;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .game-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.8);
            background: linear-gradient(135deg, #ff0055, #cc00ff);
        }
        
        #start-screen .game-btn {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(204, 0, 255, 0.6); }
            70% { box-shadow: 0 0 0 20px rgba(204, 0, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(204, 0, 255, 0); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="top-score-board" class="score-board">
            <div>Score: <span id="score" class="neon-text">0</span></div>
            <div>Rows: <span id="rows-cleared" class="pink-text">0</span></div>
        </div>
        
        <div id="start-screen" class="overlay-screen">
            <div class="game-title">Brick Breaker</div>
            <div class="sub-title">Fun</div>
            <button class="game-btn" onclick="startGame()">Play Now</button>
        </div>

        <div id="game-over-screen" class="overlay-screen" style="display: none;">
            <div class="game-over-title">Game Over</div>
            <p style="font-size: 20px; color: #d1d5db; margin-top: 0; margin-bottom: 40px; font-weight: 600;">
                Final Score: <span id="final-score" class="neon-text" style="font-size: 26px;">0</span>
            </p>
            <button class="game-btn" onclick="resetGame()">Try Again</button>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        // ==========================================
        // ORANGE JAM SDK INITIALIZATION
        // ==========================================
        const PROJECT_ID = "orangeid-6uitzmLpEM";
        const API_KEY = "06529081adfc434abfc5a14ebdfae8ea";

        // গেম শুরু হওয়ার সাথে সাথে Orange SDK ইনিশিয়ালাইজ করা হচ্ছে
        try {
            if (typeof OrangeJam !== 'undefined') {
                OrangeJam.init({
                    projectId: PROJECT_ID,
                    apiKey: API_KEY
                });
                console.log("Orange Jam SDK Initialized Successfully!");
            } else {
                console.log("Orange Jam SDK script not loaded yet.");
            }
        } catch (e) {
            console.error("SDK Initialization Error:", e);
        }

        // স্কোয়াড বা লিডারবোর্ডে স্কোর পাঠানোর ফাংশন
        function sendScoreToOrange(finalScore) {
            if (typeof OrangeJam !== 'undefined') {
                OrangeJam.submitScore({
                    score: finalScore
                }).then(response => {
                    console.log("Score successfully submitted to Orange Jam!", response);
                }).catch(error => {
                    console.error("Failed to submit score:", error);
                });
            } else {
                console.log("OrangeJam SDK is not available to submit score.");
            }
        }
        // ==========================================

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const topScoreBoard = document.getElementById("top-score-board");
        const scoreEl = document.getElementById("score");
        const rowsEl = document.getElementById("rows-cleared");
        
        const startScreen = document.getElementById("start-screen");
        const gameOverScreen = document.getElementById("game-over-screen");
        const finalScoreEl = document.getElementById("final-score");

        let score = 0;
        const columns = 6;
        const brickWidth = canvas.width / columns;
        const brickHeight = 40;
        let currentLevel = 1;
        let isGameRunning = false;
        let isGameOver = false;
        
        let bricks = [];
        let balls = [];
        let particles = []; 
        let baseBall = { x: canvas.width / 2, y: canvas.height - 30, radius: 8, speed: 8 };
        
        let isAiming = false;
        let isShooting = false;
        let aimX = 0;
        let aimY = 0;

        const colors = ["#ff0055", "#00ffcc", "#cc00ff", "#ffcc00", "#00ccff", "#39ff14", "#ff5500"];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.color = color;
                this.alpha = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Brick {
            constructor(x, y, value) {
                this.x = x;
                this.y = y;
                this.w = brickWidth - 6;
                this.h = brickHeight - 6;
                this.value = value;
            }
            draw() {
                if (this.value <= 0) return;
                let colorIndex = Math.min(Math.floor(this.value / 5), colors.length - 1);
                let baseColor = colors[colorIndex];
                
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = baseColor;
                
                let gradient = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
                gradient.addColorStop(0, adjustColorBrightness(baseColor, 20));
                gradient.addColorStop(1, adjustColorBrightness(baseColor, -30));
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(this.x + 3, this.y + 3, this.w, this.h, 10);
                ctx.fill();
                
                ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                ctx.beginPath();
                ctx.roundRect(this.x + 3, this.y + 3, this.w, this.h / 2, 10);
                ctx.fill();
                ctx.restore();

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowBlur = 4;
                ctx.shadowColor = "#000";
                ctx.fillText(this.value, this.x + brickWidth/2, this.y + brickHeight/2);
            }
        }

        class Ball {
            constructor(x, y, dx, dy) {
                this.x = x;
                this.y = y;
                this.radius = baseBall.radius;
                this.dx = dx * baseBall.speed;
                this.dy = dy * baseBall.speed;
                this.active = true;
                this.color = "#00ffcc"; 
            }
            update() {
                if (!this.active) return;
                this.x += this.dx;
                this.y += this.dy;

                if (this.x - this.radius <= 0 || this.x + this.radius >= canvas.width) {
                    this.dx *= -1;
                    this.x = this.x - this.radius <= 0 ? this.radius : canvas.width - this.radius;
                }
                if (this.y - this.radius <= 0) {
                    this.dy *= -1;
                    this.y = this.radius;
                }
                if (this.y + this.radius >= canvas.height) {
                    this.active = false;
                }

                for (let brick of bricks) {
                    if (brick.value > 0) {
                        if (this.x + this.radius > brick.x + 3 && 
                            this.x - this.radius < brick.x + 3 + brick.w &&
                            this.y + this.radius > brick.y + 3 && 
                            this.y - this.radius < brick.y + 3 + brick.h) {
                            
                            this.dy *= -1;
                            brick.value--;
                            score += 10;
                            scoreEl.innerText = score;
                            
                            let colorIndex = Math.min(Math.floor((brick.value + 1) / 5), colors.length - 1);
                            createParticles(this.x, this.y, colors[colorIndex]);
                            
                            this.color = colors[colorIndex];
                            break;
                        }
                    }
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ffffff"; 
                ctx.fill();
                ctx.strokeStyle = this.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 12; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function startGame() {
            startScreen.style.display = "none";
            topScoreBoard.style.display = "flex"; 
            isGameRunning = true;
            generateRow();
        }

        function generateRow() {
            if (isGameOver || !isGameRunning) return;
            for (let brick of bricks) {
                brick.y += brickHeight;
                if (brick.y + brickHeight >= canvas.height - 60 && brick.value > 0) {
                    triggerGameOver();
                    return;
                }
            }
            for (let i = 0; i < columns; i++) {
                if (Math.random() > 0.35) {
                    let startValue = currentLevel * 3 + Math.floor(Math.random() * 5);
                    bricks.push(new Brick(i * brickWidth, 65, startValue)); 
                }
            }
            currentLevel++;
            rowsEl.innerText = currentLevel - 1;
        }

        function triggerGameOver() {
            isGameOver = true;
            finalScoreEl.innerText = score;
            topScoreBoard.style.display = "none"; 
            gameOverScreen.style.display = "flex"; 
            
            // Orange Jam প্ল্যাটফর্মে ফাইনাল স্কোর পাঠানো হচ্ছে
            if(score > 0) {
                sendScoreToOrange(score);
            }
        }

        function resetGame() {
            bricks = [];
            balls = [];
            particles = [];
            score = 0;
            currentLevel = 1;
            isGameOver = false;
            scoreEl.innerText = score;
            rowsEl.innerText = 0;
            
            gameOverScreen.style.display = "none"; 
            topScoreBoard.style.display = "flex"; 
            generateRow();
        }

        canvas.addEventListener("mousedown", (e) => {
            if (isShooting || isGameOver || !isGameRunning) return;
            isAiming = true;
            updateAim(e);
        });
        canvas.addEventListener("mousemove", (e) => {
            if (isAiming && !isGameOver) updateAim(e);
        });
        window.addEventListener("mouseup", () => {
            if (!isAiming || isGameOver) return;
            isAiming = false;
            shootBalls();
        });
        canvas.addEventListener("touchstart", (e) => {
            if (isShooting || isGameOver || !isGameRunning) return;
            isAiming = true;
            updateAim(e.touches[0]);
        });
        canvas.addEventListener("touchmove", (e) => {
            if (isAiming && !isGameOver) updateAim(e.touches[0]);
        });
        canvas.addEventListener("touchend", () => {
            if (!isAiming || isGameOver) return;
            isAiming = false;
            shootBalls();
        });

        function updateAim(e) {
            const rect = canvas.getBoundingClientRect();
            aimX = e.clientX - rect.left;
            aimY = e.clientY - rect.top;
        }

        function shootBalls() {
            isShooting = true;
            let angle = Math.atan2(aimY - baseBall.y, aimX - baseBall.x);
            if (angle > -0.15 && angle < Math.PI) angle = -0.15;
            if (angle < -Math.PI + 0.15 && angle > -Math.PI) angle = -Math.PI + 0.15;

            let dx = Math.cos(angle);
            let dy = Math.sin(angle);
            let ballCount = 20 + Math.floor(currentLevel / 2); 
            let delay = 0;

            for (let i = 0; i < ballCount; i++) {
                setTimeout(() => {
                    if (!isGameOver) balls.push(new Ball(baseBall.x, baseBall.y, dx, dy));
                }, delay);
                delay += 100; 
            }
        }

        function adjustColorBrightness(hex, percent) {
            let R = parseInt(hex.substring(1, 3), 16);
            let G = parseInt(hex.substring(3, 5), 16);
            let B = parseInt(hex.substring(5, 7), 16);
            R = parseInt((R * (100 + percent)) / 100);
            G = parseInt((G * (100 + percent)) / 100);
            B = parseInt((B * (100 + percent)) / 100);
            R = R < 255 ? R : 255; G = G < 255 ? G : 255; B = B < 255 ? B : 255;
            R = R > 0 ? R : 0; G = G > 0 ? G : 0; B = B > 0 ? B : 0;
            let rHex = R.toString(16).padStart(2, '0');
            let gHex = G.toString(16).padStart(2, '0');
            let bHex = B.toString(16).padStart(2, '0');
            return `#${rHex}${gHex}${bHex}`;
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (isGameRunning) {
                bricks = bricks.filter(b => b.value > 0);
                bricks.forEach(b => b.draw());

                particles = particles.filter(p => p.alpha > 0);
                particles.forEach(p => { p.update(); p.draw(); });

                if (isAiming && !isGameOver) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(baseBall.x, baseBall.y);
                    let angle = Math.atan2(aimY - baseBall.y, aimX - baseBall.x);
                    ctx.lineTo(baseBall.x + Math.cos(angle) * 200, baseBall.y + Math.sin(angle) * 200);
                    
                    let grad = ctx.createLinearGradient(baseBall.x, baseBall.y, baseBall.x + Math.cos(angle) * 200, baseBall.y + Math.sin(angle) * 200);
                    grad.addColorStop(0, "rgba(0, 255, 204, 0.8)");
                    grad.addColorStop(1, "rgba(0, 255, 204, 0)");
                    
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = 4;
                    ctx.setLineDash([10, 8]);
                    ctx.stroke();
                    ctx.restore();
                }

                balls.forEach(b => { b.update(); b.draw(); });

                if (isShooting && !isGameOver) {
                    if (balls.filter(b => b.active).length === 0) {
                        balls = [];
                        isShooting = false;
                        generateRow();
                    }
                }
                
                if (!isShooting && !isGameOver) {
                    ctx.save();
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = "#cc00ff";
                    ctx.beginPath();
                    ctx.arc(baseBall.x, baseBall.y, baseBall.radius + 2, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();
                    ctx.strokeStyle = "#cc00ff";
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                }
            }
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
