<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker Fun</title>
    <style>
        body {
            margin: 0;
            background-color: #080c14;
            color: white;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 40px rgba(255, 102, 0, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 102, 0, 0.15);
            border-radius: 24px;
            overflow: hidden;
            width: 400px;
            height: 600px;
            background: #0d1321;
        }
        canvas {
            display: block;
            background: #0d1321;
        }
        
        /* প্রিমিয়াম মডার্ন স্কোর বোর্ড */
        .score-board {
            display: none;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-sizing: border-box;
            z-index: 5;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
        }
        .orange-text {
            color: #ff6600;
            text-shadow: 0 0 12px rgba(255, 102, 0, 0.6);
        }
        .white-text {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }
        
        /* ওভারলে স্ক্রিনসমূহ */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #131c2e 0%, #070b12 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            padding: 30px;
            z-index: 10;
        }

        /* আল্ট্রা প্রিমিয়াম টাইটেল */
        .game-title {
            color: #ff6600;
            font-size: 46px;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 2px;
            text-align: center;
            text-shadow: 0 0 25px rgba(255, 102, 0, 0.7);
            font-weight: 900;
        }
        .sub-title {
            color: #ffffff;
            font-size: 20px;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 50px;
            opacity: 0.9;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .game-over-title {
            color: #ff3366;
            font-size: 40px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 51, 102, 0.5);
            margin-bottom: 10px;
            font-weight: 900;
        }

        /* আধুনিক গ্লসি বাটন */
        .game-btn {
            background: linear-gradient(135deg, #ff6600, #ff3300);
            color: white;
            border: none;
            padding: 16px 55px;
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.4);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 2px;
        }
        .game-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 102, 0, 0.7);
        }
        
        #start-screen .game-btn {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(255, 102, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 102, 0, 0); }
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <div id="top-score-board" class="score-board">
            <div>Score: <span id="score" class="orange-text">0</span></div>
            <div>Rows: <span id="rows-cleared" class="white-text">0</span></div>
        </div>
        
        <div id="start-screen" class="overlay-screen">
            <div class="game-title">Brick Breaker</div>
            <div class="sub-title">Fun</div>
            <button class="game-btn" onclick="startGame()">Play</button>
        </div>

        <div id="game-over-screen" class="overlay-screen" style="display: none;">
            <div class="game-over-title">Game Over</div>
            <p style="font-size: 18px; color: #a0aec0; margin-top: 0; margin-bottom: 40px; font-weight: 600;">
                Final Score: <span id="final-score" class="orange-text">0</span>
            </p>
            <button class="game-btn" onclick="resetGame()">Try Again</button>
        </div>
        
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const topScoreBoard = document.getElementById("top-score-board");
        const scoreEl = document.getElementById("score");
        const rowsEl = document.getElementById("rows-cleared");
        
        const startScreen = document.getElementById("start-screen");
        const gameOverScreen = document.getElementById("game-over-screen");
        const finalScoreEl = document.getElementById("final-score");

        let score = 0;
        const columns = 6;
        const brickWidth = canvas.width / columns;
        const brickHeight = 40;
        let currentLevel = 1;
        let isGameRunning = false;
        let isGameOver = false;
        
        let bricks = [];
        let balls = [];
        let particles = []; // নতুন বিস্ফোরণ পার্টিক্যালস এফেক্ট
        let baseBall = { x: canvas.width / 2, y: canvas.height - 25, radius: 8, speed: 8 };
        
        let isAiming = false;
        let isShooting = false;
        let aimX = 0;
        let aimY = 0;

        // নিয়ন গ্লোয়িং কালার প্যালেট
        const colors = ["#ff3366", "#ff5500", "#ffaa00", "#10b981", "#3b82f6", "#8b5cf6"];

        // পার্টিক্যাল ক্লাস (ব্রিক ভাঙার চমৎকার এনিমেশনের জন্য)
        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6;
                this.color = color;
                this.alpha = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.03;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        class Brick {
            constructor(x, y, value) {
                this.x = x;
                this.y = y;
                this.w = brickWidth - 6;
                this.h = brickHeight - 6;
                this.value = value;
            }
            draw() {
                if (this.value <= 0) return;
                let colorIndex = Math.min(Math.floor(this.value / 10), colors.length - 1);
                let baseColor = colors[colorIndex];
                
                // গ্লোয়িং নিয়ন বর্ডার এবং কার্ড স্টাইল ডিজাইন
                ctx.save();
                ctx.shadowBlur = 10;
                ctx.shadowColor = baseColor;
                
                // গ্রেডিয়েন্ট ফিল
                let gradient = ctx.createLinearGradient(this.x, this.y, this.x, this.y + this.h);
                gradient.addColorStop(0, baseColor);
                gradient.addColorStop(1, adjustColorBrightness(baseColor, -30));
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(this.x + 3, this.y + 3, this.w, this.h, 8);
                ctx.fill();
                ctx.restore();

                // ভেতরের টেক্সট
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px sans-serif";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText(this.value, this.x + brickWidth/2, this.y + brickHeight/2);
            }
        }

        class Ball {
            constructor(x, y, dx, dy) {
                this.x = x;
                this.y = y;
                this.radius = baseBall.radius;
                this.dx = dx * baseBall.speed;
                this.dy = dy * baseBall.speed;
                this.active = true;
            }
            update() {
                if (!this.active) return;
                this.x += this.dx;
                this.y += this.dy;

                // দেওয়ালের সাথে রিফ্লেকশন
                if (this.x - this.radius <= 0 || this.x + this.radius >= canvas.width) {
                    this.dx *= -1;
                    this.x = this.x - this.radius <= 0 ? this.radius : canvas.width - this.radius;
                }
                if (this.y - this.radius <= 0) {
                    this.dy *= -1;
                    this.y = this.radius;
                }
                if (this.y + this.radius >= canvas.height) {
                    this.active = false;
                }

                // ব্রিক কোলাইড চেকিং
                for (let brick of bricks) {
                    if (brick.value > 0) {
                        if (this.x + this.radius > brick.x + 3 && 
                            this.x - this.radius < brick.x + 3 + brick.w &&
                            this.y + this.radius > brick.y + 3 && 
                            this.y - this.radius < brick.y + 3 + brick.h) {
                            
                            this.dy *= -1;
                            brick.value--;
                            score += 10;
                            scoreEl.innerText = score;
                            
                            // আঘাত হানার পর পার্টিক্যাল তৈরি করা
                            let colorIndex = Math.min(Math.floor((brick.value + 1) / 10), colors.length - 1);
                            createParticles(this.x, this.y, colors[colorIndex]);
                            break;
                        }
                    }
                }
            }
            draw() {
                if (!this.active) return;
                ctx.save();
                ctx.shadowBlur = 8;
                ctx.shadowColor = "#ff6600";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = "#ff6600";
                ctx.fill();
                ctx.restore();
            }
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function startGame() {
            startScreen.style.display = "none";
            topScoreBoard.style.display = "flex"; 
            isGameRunning = true;
            generateRow();
        }

        function generateRow() {
            if (isGameOver || !isGameRunning) return;
            for (let brick of bricks) {
                brick.y += brickHeight;
                if (brick.y + brickHeight >= canvas.height - 50 && brick.value > 0) {
                    triggerGameOver();
                    return;
                }
            }
            for (let i = 0; i < columns; i++) {
                if (Math.random() > 0.35) {
                    let startValue = currentLevel * 4 + Math.floor(Math.random() * 6);
                    bricks.push(new Brick(i * brickWidth, 50, startValue)); // স্কোরবোর্ডের নিচে নামানো হলো
                }
            }
            currentLevel++;
            rowsEl.innerText = currentLevel - 1;
        }

        function triggerGameOver() {
            isGameOver = true;
            finalScoreEl.innerText = score;
            topScoreBoard.style.display = "none"; 
            gameOverScreen.style.display = "flex"; 
        }

        function resetGame() {
            bricks = [];
            balls = [];
            particles = [];
            score = 0;
            currentLevel = 1;
            isGameOver = false;
            scoreEl.innerText = score;
            rowsEl.innerText = 0;
            
            gameOverScreen.style.display = "none"; 
            topScoreBoard.style.display = "flex"; 
            generateRow();
        }

        // ইনপুট ইভেন্টসমূহ
        canvas.addEventListener("mousedown", (e) => {
            if (isShooting || isGameOver || !isGameRunning) return;
            isAiming = true;
            updateAim(e);
        });
        canvas.addEventListener("mousemove", (e) => {
            if (isAiming && !isGameOver) updateAim(e);
        });
        window.addEventListener("mouseup", () => {
            if (!isAiming || isGameOver) return;
            isAiming = false;
            shootBalls();
        });
        canvas.addEventListener("touchstart", (e) => {
            if (isShooting || isGameOver || !isGameRunning) return;
            isAiming = true;
            updateAim(e.touches[0]);
        });
        canvas.addEventListener("touchmove", (e) => {
            if (isAiming && !isGameOver) updateAim(e.touches[0]);
        });
        canvas.addEventListener("touchend", () => {
            if (!isAiming || isGameOver) return;
            isAiming = false;
            shootBalls();
        });

        function updateAim(e) {
            const rect = canvas.getBoundingClientRect();
            aimX = e.clientX - rect.left;
            aimY = e.clientY - rect.top;
        }

        function shootBalls() {
            isShooting = true;
            let angle = Math.atan2(aimY - baseBall.y, aimX - baseBall.x);
            if (angle > -0.15 && angle < Math.PI) angle = -0.15;
            if (angle < -Math.PI + 0.15 && angle > -Math.PI) angle = -Math.PI + 0.15;

            let dx = Math.cos(angle);
            let dy = Math.sin(angle);
            let ballCount = 20; 
            let delay = 0;

            for (let i = 0; i < ballCount; i++) {
                setTimeout(() => {
                    if (!isGameOver) balls.push(new Ball(baseBall.x, baseBall.y, dx, dy));
                }, delay);
                delay += 120; // বল বের হওয়ার রেট আরও স্মুথ করা হয়েছে
            }
        }

        // কালার ব্রাইটনেস ঠিক করার ইউটিলিটি ফাংশন
        function adjustColorBrightness(hex, percent) {
            let R = parseInt(hex.substring(1, 3), 16);
            let G = parseInt(hex.substring(3, 5), 16);
            let B = parseInt(hex.substring(5, 7), 16);
            R = parseInt((R * (100 + percent)) / 100);
            G = parseInt((G * (100 + percent)) / 100);
            B = parseInt((B * (100 + percent)) / 100);
            R = R < 255 ? R : 255; G = G < 255 ? G : 255; B = B < 255 ? B : 255;
            R = R > 0 ? R : 0; G = G > 0 ? G : 0; B = B > 0 ? B : 0;
            let rHex = R.toString(16).padStart(2, '0');
            let gHex = G.toString(16).padStart(2, '0');
            let bHex = B.toString(16).padStart(2, '0');
            return `#${rHex}${gHex}${bHex}`;
        }

        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (isGameRunning) {
                // ব্রিকস রেন্ডার
                bricks = bricks.filter(b => b.value > 0);
                bricks.forEach(b => b.draw());

                // পার্টিক্যালস এফেক্ট আপডেট ও ড্র
                particles = particles.filter(p => p.alpha > 0);
                particles.forEach(p => { p.update(); p.draw(); });

                // লেজার এইমিং গাইডলাইন (উন্নত ডিজাইন)
                if (isAiming && !isGameOver) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(baseBall.x, baseBall.y);
                    let angle = Math.atan2(aimY - baseBall.y, aimX - baseBall.x);
                    ctx.lineTo(baseBall.x + Math.cos(angle) * 180, baseBall.y + Math.sin(angle) * 180);
                    ctx.strokeStyle = "rgba(255, 102, 0, 0.5)";
                    ctx.lineWidth = 3;
                    ctx.setLineDash([8, 6]);
                    ctx.stroke();
                    ctx.restore();
                }

                // বল আপডেট
                balls.forEach(b => { b.update(); b.draw(); });

                // রাউন্ড শেষ হওয়া চেক করা
                if (isShooting && !isGameOver) {
                    if (balls.filter(b => b.active).length === 0) {
                        balls = [];
                        isShooting = false;
                        generateRow();
                    }
                }
                
                // মেইন শুটিং প্যাড / বেস বল ড্র
                if (!isShooting && !isGameOver) {
                    ctx.save();
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = "#ffffff";
                    ctx.beginPath();
                    ctx.arc(baseBall.x, baseBall.y, baseBall.radius, 0, Math.PI * 2);
                    ctx.fillStyle = "#ffffff";
                    ctx.fill();
                    ctx.restore();
                }
            }
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
